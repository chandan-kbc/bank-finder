<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All India Bank IFSC Code Finder</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #f1f5f9; margin: 0; padding: 15px; }
        .box { max-width: 500px; margin: 20px auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        h1 { font-size: 22px; color: #0f172a; text-align: center; margin-top: 0; }
        p { color: #64748b; text-align: center; font-size: 14px; }
        .input-group { display: flex; gap: 8px; margin: 20px 0; }
        input { flex: 1; padding: 12px; font-size: 16px; border: 2px solid #cbd5e1; border-radius: 8px; text-transform: uppercase; outline: none; }
        input:focus { border-color: #2563eb; }
        button { background: #2563eb; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 8px; cursor: pointer; }
        #result { display: none; margin-top: 20px; border-top: 2px dashed #e2e8f0; padding-top: 15px; }
        .badge { background: #e0f2fe; color: #0369a1; padding: 10px; border-radius: 8px; font-weight: bold; font-size: 18px; text-align: center; margin-bottom: 15px; }
        .row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f8fafc; font-size: 14px; }
        .label { color: #64748b; }
        .val { color: #0f172a; font-weight: 600; text-align: right; }
        .share-btn { display: block; text-align: center; background: #16a34a; color: white; padding: 12px; border-radius: 8px; text-decoration: none; font-weight: bold; margin-top: 15px; }
        #error { display: none; color: #dc2626; text-align: center; font-weight: 500; margin-top: 15px; }
    </style>
</head>
<body>
    <div class="box">
        <h1>🏦 All India IFSC Finder</h1>
        <p>भारत के किसी भी बैंक का 11 अक्षरों का IFSC कोड दर्ज करें</p>
        
        <div class="input-group">
            <input type="text" id="ifscCode" placeholder="उदा. SBIN0000152" maxlength="11">
            <button onclick="searchIFSC()">खोजें</button>
        </div>

        <div id="error">गलत IFSC कोड! कृपया सही कोड दर्ज करें।</div>

        <div id="result">
            <div class="badge" id="resIfsc"></div>
            <div class="row"><span class="label">बैंक</span><span class="val" id="resBank"></span></div>
            <div class="row"><span class="label">शाखा</span><span class="val" id="resBranch"></span></div>
            <div class="row"><span class="label">शहर / ज़िला</span><span class="val" id="resCity"></span></div>
            <div class="row"><span class="label">राज्य</span><span class="val" id="resState"></span></div>
            <div class="row"><span class="label">पता</span><span class="val" id="resAddress"></span></div>
            <a href="#" id="shareLink" class="share-btn">WhatsApp पर भेजें</a>
        </div>
    </div>

    <script>
        function searchIFSC() {
            var code = document.getElementById('ifscCode').value.trim().toUpperCase();
            var err = document.getElementById('error');
            var res = document.getElementById('result');
            
            if(code.length !== 11) {
                err.innerText = "IFSC कोड पूरे 11 अक्षरों का होना चाहिए!";
                err.style.display = "block";
                res.style.display = "none";
                return;
            }

            fetch('https://ifsc.razorpay.com/' + code)
                .then(response => {
                    if (!response.ok) throw new Error();
                    return response.json();
                })
                .then(data => {
                    err.style.display = "none";
                    document.getElementById('resIfsc').innerText = "IFSC: " + data.IFSC;
                    document.getElementById('resBank').innerText = data.BANK;
                    document.getElementById('resBranch').innerText = data.BRANCH;
                    document.getElementById('resCity').innerText = data.CITY + ", " + data.DISTRICT;
                    document.getElementById('resState').innerText = data.STATE;
                    document.getElementById('resAddress').innerText = data.ADDRESS;
                    
                    var msg = encodeURIComponent(data.BANK + " (" + data.BRANCH + ") IFSC: " + data.IFSC);
                    document.getElementById('shareLink').href = "https://wa.me/?text=" + msg;
                    
                    res.style.display = "block";
                })
                .catch(() => {
                    err.innerText = "यह IFSC कोड नहीं मिला। कृपया दोबारा जांचें!";
                    err.style.display = "block";
                    res.style.display = "none";
                });
        }
    </script>
</body>
</html>
